version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gg_carriers_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gg_carriers_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gg_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gg_carriers_api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gg_carriers_crm
      NODE_ENV: development
      JWT_SECRET: your_jwt_secret_key
      PORT: 5000
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - gg_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gg_carriers_web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - gg_network

volumes:
  postgres_data:

networks:
  gg_network:
    driver: bridge
